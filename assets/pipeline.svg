<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Collect, test on a real J714s, ship through omarchy update, send upstream">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#565f89"/>
    </marker>
  </defs>
  <rect width="1200" height="170" rx="16" fill="#1a1b26"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <g stroke="#565f89" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arr)">
      <path d="M262 85h50"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
      <path d="M552 85h50"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
      <path d="M842 85h50"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    </g>
    <g>
      <rect x="32" y="25" width="230" height="120" rx="14" fill="#1f2335" stroke="#7aa2f7"/>
      <text x="147" y="65" text-anchor="middle" font-size="22" font-weight="700" fill="#7aa2f7">1 · Collect</text>
      <text x="147" y="95" text-anchor="middle" font-size="15" fill="#a9b1d6">watch 100+ M5 repos</text>
      <text x="147" y="117" text-anchor="middle" font-size="15" fill="#a9b1d6">every 30 minutes</text>
    </g>
    <g>
      <rect x="322" y="25" width="230" height="120" rx="14" fill="#1f2335" stroke="#e0af68"/>
      <text x="437" y="65" text-anchor="middle" font-size="22" font-weight="700" fill="#e0af68">2 · Test</text>
      <text x="437" y="95" text-anchor="middle" font-size="15" fill="#a9b1d6">on a real J714s,</text>
      <text x="437" y="117" text-anchor="middle" font-size="15" fill="#a9b1d6">with a fallback kept</text>
    </g>
    <g>
      <rect x="612" y="25" width="230" height="120" rx="14" fill="#1f2335" stroke="#9ece6a"/>
      <text x="727" y="65" text-anchor="middle" font-size="22" font-weight="700" fill="#9ece6a">3 · Ship</text>
      <text x="727" y="95" text-anchor="middle" font-size="15" fill="#a9b1d6">signed [omarchy-m5] repo</text>
      <text x="727" y="117" text-anchor="middle" font-size="15" fill="#a9b1d6">→ omarchy update</text>
    </g>
    <g>
      <rect x="902" y="25" width="266" height="120" rx="14" fill="#1f2335" stroke="#bb9af7"/>
      <text x="1035" y="65" text-anchor="middle" font-size="22" font-weight="700" fill="#bb9af7">4 · Upstream</text>
      <text x="1035" y="95" text-anchor="middle" font-size="15" fill="#a9b1d6">credit the author, report results,</text>
      <text x="1035" y="117" text-anchor="middle" font-size="15" fill="#a9b1d6">drop our copy when it merges</text>
    </g>
  </g>
</svg>
