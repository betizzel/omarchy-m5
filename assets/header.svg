<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="omarchy-m5: Omarchy on the M5 Pro MacBook Pro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="0.55" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#9ece6a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#414868" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="960" cy="160" r="230" fill="url(#glow)">
      <animate attributeName="r" values="210;245;210" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- the chip -->
    <g transform="translate(860 60)">
      <g stroke="#565f89" stroke-width="3" stroke-linecap="round">
        <path d="M40 0v-18M80 0v-18M120 0v-18M160 0v-18"/>
        <path d="M40 200v18M80 200v18M120 200v18M160 200v18"/>
        <path d="M0 40h-18M0 80h-18M0 120h-18M0 160h-18"/>
        <path d="M200 40h18M200 80h18M200 120h18M200 160h18"/>
      </g>
      <rect width="200" height="200" rx="26" fill="#1f2335" stroke="url(#title)" stroke-width="3"/>
      <rect x="18" y="18" width="164" height="164" rx="16" fill="none" stroke="#414868" stroke-width="1.5"/>
      <text x="100" y="112" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#c0caf5">M5</text>
      <text x="100" y="146" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="4" fill="#7dcfff">PRO</text>
      <circle cx="170" cy="30" r="5" fill="#9ece6a">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- text -->
    <text x="70" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#title)">omarchy-m5</text>
    <text x="72" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#c0caf5">Omarchy on the 14" MacBook Pro with M5 Pro</text>
    <text x="72" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#7aa2f7">$ omarchy update</text>
    <text x="270" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#565f89"># everybody's tested M5 work, in one place</text>
    <rect x="246" y="213" width="10" height="18" fill="#9ece6a">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
      <rect x="72" y="266" width="86" height="26" rx="13" fill="#9ece6a" fill-opacity="0.15" stroke="#9ece6a" stroke-opacity="0.6"/>
      <text x="115" y="284" text-anchor="middle" fill="#9ece6a">J714s</text>
      <rect x="168" y="266" width="96" height="26" rx="13" fill="#7aa2f7" fill-opacity="0.15" stroke="#7aa2f7" stroke-opacity="0.6"/>
      <text x="216" y="284" text-anchor="middle" fill="#7aa2f7">T6050</text>
      <rect x="274" y="266" width="118" height="26" rx="13" fill="#bb9af7" fill-opacity="0.15" stroke="#bb9af7" stroke-opacity="0.6"/>
      <text x="333" y="284" text-anchor="middle" fill="#bb9af7">macOS 27.2</text>
      <rect x="402" y="266" width="76" height="26" rx="13" fill="#e0af68" fill-opacity="0.15" stroke="#e0af68" stroke-opacity="0.6"/>
      <text x="440" y="284" text-anchor="middle" fill="#e0af68">edge</text>
    </g>
  </g>
</svg>
