# Wi-Fi power save on for the M5 Macs' N1 (Broadcom/Apple Centauri) radio. Omarchy's omarchy-wifi-powersave.conf
# turns it off (2); this file sorts after it. erikwb measured about -0.35 W with it on (J716c,
# weirdware.io/aurora/j716c-energy.html); on our J714s iw reports it on and ping shows no loss.
# Set wifi.powersave = 2 in a later file (or delete this one) to turn it off.
[connection]
wifi.powersave = 3
