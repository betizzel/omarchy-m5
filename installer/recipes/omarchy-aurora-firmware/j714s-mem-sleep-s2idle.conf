# Lid sleep stays s2idle on the J714s. Since linux-aurora v272-23 the deep sleep driver probes on the
# 15-core M5 Pro and makes deep the default, but after a deep-sleep wake the PMP does not come back and the
# CPUs stay capped at about 1.3 GHz until a reboot (aurora-silicon/linux #3419). Deep stays selectable:
#   echo deep | sudo tee /sys/power/mem_sleep
# Override with a file of the same name in /etc/tmpfiles.d.
w /sys/power/mem_sleep - - - - s2idle
