# linux-aurora (aurora-silicon base): keep the J714s speakers under the kernel's lock.
#
# This kernel's J714s speaker card (aurora-silicon #1554) is guarded upstream by speakerguardd v2
# with each Mac's own tuning. The image ships no speakersafetyd profile for the J714
# (omarchy-aurora-firmware j714s8 dropped j714.conf), so speakersafetyd never takes the J714
# speakers here: they stay at the kernel's floor until speakerguardd v2 qualifies this Mac's
# tuning (aurora-speaker-upgrade) and owns them. Headphones and microphones are not affected.
# Other Macs are untouched.
[Service]
ExecCondition=/bin/sh -c '! tr "\\000" "\\n" < /proc/device-tree/compatible | grep -Eqx "apple,j714[sc]?"'
